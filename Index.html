
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVS Bike Registry</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10131b;
  color: white;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: 35px auto;
  background: #1c2230;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 8px 30px #0006;
}
h1 {
  text-align: center;
  color: #ff5b35;
}
p {
  text-align: center;
  color: #c6cada;
}
input {
  width: 100%;
  padding: 15px;
  margin: 15px 0;
  border: 2px solid #ff5b35;
  border-radius: 8px;
  font-size: 18px;
  text-transform: uppercase;
}
button {
  width: 100%;
  padding: 14px;
  background: #ff5b35;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
#result {
  margin-top: 20px;
}
.item {
  background: #292f40;
  padding: 13px;
  margin: 9px 0;
  border-radius: 8px;
  overflow-wrap: anywhere;
}
.label {
  color: #ff8b70;
  font-weight: bold;
}
.note {
  font-size: 12px;
  line-height: 1.6;
}
</style>
</head>

<body>
<div class="container">
  <h1>TVS BIKE REGISTRY</h1>
  <p>Vehicle Number Plate Lookup</p>

  <input
    id="plate"
    type="text"
    maxlength="10"
    placeholder="Example: KA03AB1234"
    autocomplete="off"
  >

  <button onclick="lookupBike()">SEARCH VEHICLE</button>

  <div id="result"></div>

  <p class="note">
    Demo only. No official vehicle, insurance or licence database
    is connected. Do not enter personal or sensitive information.
  </p>
</div>

<script>
function lookupBike() {
  const plate = document.getElementById("plate")
    .value.trim().toUpperCase();

  const result = document.getElementById("result");

  // Basic Indian registration number format
  const valid = /^[A-Z]{2}[0-9]{1,2}[A-Z]{1,3}[0-9]{4}$/
    .test(plate);

  if (!valid) {
    result.innerHTML =
      '<div class="item">Please enter a valid-format number plate, ' +
      'for example KA03AB1234.</div>';
    return;
  }

  // These are placeholders, not actual vehicle records.
  result.innerHTML = `
    <h3>Search Result</h3>
    <div class="item">
      <span class="label">Registration Number:</span>
      ${plate}
    </div>
    <div class="item">
      <span class="label">Manufacturer:</span>
      TVS (not verified)
    </div>
    <div class="item">
      <span class="label">Vehicle Model:</span>
      Not available
    </div>
    <div class="item">
      <span class="label">Registration Date:</span>
      Not available
    </div>
    <div class="item">
      <span class="label">Registration Validity:</span>
      Not verified
    </div>
    <div class="item">
      <span class="label">Insurance Status:</span>
      Check official records
    </div>
    <div class="item">
      <span class="label">PUC Status:</span>
      Check official records
    </div>
    <div class="item">
      <span class="label">Driving Licence:</span>
      A vehicle number alone cannot verify a person's licence.
    </div>
    <div class="item">
      <b>Demo notice:</b> No official records were retrieved.
    </div>
  `;
}
</script>
</body>
</html>
